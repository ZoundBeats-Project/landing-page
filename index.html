<!doctype html>
<html lang="en">
<head>

    <title>ZoundBeats – Domina Tu Sonido</title>
    <link rel="stylesheet" href="public/assets/styles/styles.css" />
    <!-- Fuentes de Google: Poppins para títulos, Inter para cuerpo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<!--  BARRA DE NAVEGACIÓN -->
<header class="navbar">
    <div class="container navbar-fila">

        <!-- Logo -->
        <div class="navbar-logo">
            <span class="logo-icono">🎵</span>
            <span class="logo-texto">ZOUNDBEATS</span>
        </div>

        <!-- Links del centro -->
        <nav class="navbar-links">
            <a href="#">Inicio</a>
            <a href="#">Cursos</a>
            <a href="#">Productores</a>
            <a href="#">Comunidad</a>
            <a href="#">Premium</a>
            <a href="#">Blog</a>
        </nav>

        <!-- Botones de la derecha -->
        <div class="navbar-botones">
            <a href="#" class="btn-login">Login</a>
            <a href="#" class="btn-primario">Comenzar</a>
        </div>

    </div>
</header>

<!-- =============================================

  ============================================= -->
<section class="hero">

            <p class="hero-etiqueta">THE FUTURE OF SOUND</p>

                Domina Tu<br />

                Aprende producción musical con artistas, productores y expertos
                reales de la industria. Rompe los límites de tu creación.
            </p>
            <div class="hero-botones">
                <a href="#" class="btn-primario">Comenzar Ahora</a>
                <a href="#" class="btn-borde">Explorar Cursos</a>
            </div>
        </div>

        <!-- Columna derecha: tarjeta visual con ecualizador -->
        <div class="hero-visual">
            <div class="hero-tarjeta">
                <div class="estudio-pantalla">

                    <!-- Barras del ecualizador -->
                    <div class="barras-wrap">
                        <span class="barra"></span>

                        <span class="barra"></span>

                    <p class="estudio-etiqueta">ZOUNDBEATS STUDIO</p>
                </div>
            </div>
        </div>

    </div>
</section>
